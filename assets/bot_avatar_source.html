<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 512px; height: 512px;
    overflow: hidden;
  }
  .canvas {
    width: 512px; height: 512px;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #2563eb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* soft radial glow behind the icon for depth */
  .glow {
    position: absolute;
    width: 380px; height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 70%);
  }
  svg { position: relative; z-index: 1; filter: drop-shadow(0 8px 18px rgba(30, 27, 75, 0.35)); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- bag handle (drawn first, so the bag body cleanly covers its base) -->
      <path d="M90 100 L90 76 A30 30 0 0 1 150 76 L150 100"
            stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" fill="none"/>
      <!-- shopping bag body -->
      <path d="M74 96 L164 96 L184 208 C184.5 217 177 224 168 224 L72 224
               C63 224 55.5 217 56 208 L74 96 Z"
            fill="#FFFFFF"/>
      <!-- chat-bubble notch to signal "bot" -->
      <circle cx="120" cy="158" r="28" fill="#4f46e5"/>
      <path d="M120 184 L109 202 L133 190 Z" fill="#4f46e5"/>
      <circle cx="108" cy="158" r="5.5" fill="#FFFFFF"/>
      <circle cx="120" cy="158" r="5.5" fill="#FFFFFF"/>
      <circle cx="132" cy="158" r="5.5" fill="#FFFFFF"/>
    </svg>
  </div>
</body>
</html>
